# CodeBuild -> GitHub Actions migration (2026-07-05).
# Replaces: CodePipeline intelliverse-nakama + CodeBuild intelliverse-nakama-build.
# Faithful port of buildspec.yml (same repo): immutable tag, dashboard secret
# patch, pre-push smoke test, multi-arch push, digest-pinned rollout with
# auto-rollback, analytics backfill, conditional admin-console build.
# Rollback: set DetectChanges=true on the CodePipeline source stage.
name: Build & Deploy to EKS

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "803881282303"
  ECR_REGISTRY: 803881282303.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: intelliverse-nakama
  EKS_CLUSTER_NAME: ai-cart-auto-cluster
  K8S_NAMESPACE: aicart
  K8S_DEPLOYMENT: intelliverse-nakama
  K8S_CONTAINER: intelliverse-nakama
  # RCA 2026-07-10: the multiplayer tier (nakama/multiplayer in kube-infra)
  # runs the same intelliverse-nakama image but was NOT rolled by this
  # workflow, so it stayed pinned to a CodeBuild-era tag
  # (3.0.0-ffdf41d-build691). The ECR lifecycle policy keeps only the last
  # 10 tagged images, so once GHA pushed gha55..gha64 the old tag was
  # expired and every new multiplayer pod went ImagePullBackOff (TargetDown
  # 75%, PDB unhealthy for ~31h). Rolling both deployments to the same
  # digest keeps the two tiers aging together so neither pin can outlive
  # the lifecycle window.
  K8S_MP_DEPLOYMENT: intelliverse-nakama-multiplayer
  K8S_MP_CONTAINER: nakama
  # GATEWAY-CENTRALIZATION 2026-07-08: qwen3 = the LiteLLM-gateway path
  # (QWEN3_BASE_URL + nakama virtual key). Was "openai", which put the
  # direct api.openai.com branch (raw vendor key, now removed) first.
  LLM_PROVIDER: qwen3

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # needed for the web/-changed diff (admin console step)

      # Runs before anything expensive. 4239b28ef shipped scripts/ecr-digest.sh
      # and scripts/assert-deploy-account.sh with CRLF endings; the "Configure
      # kubectl for EKS" step sources them, so every run died at 38 s with
      # `line 10: $'\r': command not found` and master deployed nothing from
      # 2026-08-25 to 2026-08-29. .gitattributes now pins *.sh to eol=lf; this
      # step is the enforcement that actually gates the deploy.
      - name: Reject CRLF in shell scripts
        run: |
          set -euo pipefail
          bad=$(git ls-files -z '*.sh' '*.bash' 'Dockerfile' 'Dockerfile.*' \
                  | xargs -0 grep -lU $'\r' 2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings found in files a POSIX shell parses."
            echo "$bad" | sed 's/^/  /'
            echo "Fix with:  perl -i -pe 's/\r\n/\n/g' <file>   (.gitattributes has *.sh text eol=lf)"
            exit 1
          fi
          echo "No CRLF in any shell script or Dockerfile."
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error::$f fails bash -n"; exit 1; }
          done
          echo "All shell scripts pass bash -n."

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure kubectl for EKS
        run: |
          chmod +x scripts/assert-deploy-account.sh scripts/ecr-digest.sh scripts/smoke-test-js-runtime.sh
          # shellcheck disable=SC1091
          . scripts/ecr-digest.sh
          assert_aws_account "$AWS_ACCOUNT_ID" "nakama EKS deploy"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}' || true

      - name: Compute image tags
        run: |
          COMMIT_HASH=$(echo "$GITHUB_SHA" | cut -c 1-7)
          if [ -z "$COMMIT_HASH" ]; then COMMIT_HASH="nogit"; fi
          SERVER_VERSION="3.0.0"
          IMAGE_VERSION="${SERVER_VERSION}-${COMMIT_HASH}-gha${GITHUB_RUN_NUMBER}"
          REPOSITORY_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "IMAGE_VERSION=$IMAGE_VERSION" >> "$GITHUB_ENV"
          echo "REPOSITORY_URI=$REPOSITORY_URI" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$IMAGE_VERSION  REPOSITORY_URI=$REPOSITORY_URI"

      - name: Patch dashboard serverKey/bootstrapSecret from nakama-secret
        run: |
          RUNTIME_HTTP_KEY=$(kubectl get secret nakama-secret -n "$K8S_NAMESPACE" \
            -o jsonpath='{.data.http_key}' 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ -z "$RUNTIME_HTTP_KEY" ]; then
            echo "WARN: secret/nakama-secret http_key not found - falling back to 'defaultkey'"
            RUNTIME_HTTP_KEY="defaultkey"
          fi
          RUNTIME_DASHBOARD_SECRET=$(kubectl get secret nakama-secret -n "$K8S_NAMESPACE" \
            -o jsonpath='{.data.dashboard_secret}' 2>/dev/null | base64 -d 2>/dev/null || true)
          if [ -z "$RUNTIME_DASHBOARD_SECRET" ]; then
            echo "WARN: nakama-secret/dashboard_secret not found - using hardcoded fallback"
            RUNTIME_DASHBOARD_SECRET="2074ff0e9dea8fb3c8162a0301b6ea06bbb938187b89a0b6789ea583f25d34c8"
          fi
          echo "::add-mask::$RUNTIME_HTTP_KEY"
          echo "::add-mask::$RUNTIME_DASHBOARD_SECRET"
          echo "RUNTIME_HTTP_KEY=$RUNTIME_HTTP_KEY" >> "$GITHUB_ENV"
          echo "RUNTIME_DASHBOARD_SECRET=$RUNTIME_DASHBOARD_SECRET" >> "$GITHUB_ENV"
          if [ -f web/analytics-dashboard/index.html ]; then
            BEFORE=$(grep -c "serverKey: 'defaultkey'" web/analytics-dashboard/index.html || true)
            sed -i "s|serverKey: 'defaultkey'|serverKey: '${RUNTIME_HTTP_KEY}'|g" web/analytics-dashboard/index.html
            AFTER=$(grep -c "serverKey: '${RUNTIME_HTTP_KEY}'" web/analytics-dashboard/index.html || true)
            echo "serverKey occurrences before=$BEFORE after=$AFTER"
            if [ "$BEFORE" -eq 0 ] || [ "$AFTER" -eq 0 ]; then
              echo "FATAL: dashboard serverKey patch failed"; exit 1
            fi
            # The legacy dashboard embedded a bootstrapSecret placeholder that
            # had to be swapped for the runtime secret at build time. The
            # 2026-07 dashboard removed it (auth is server-validated via
            # admin_login), so the patch is conditional: only enforce it when
            # the placeholder is actually present.
            BOOT_BEFORE=$(grep -c "bootstrapSecret: '2074ff0e9dea8fb3c8162a0301b6ea06bbb938187b89a0b6789ea583f25d34c8'" web/analytics-dashboard/index.html || true)
            if [ "$BOOT_BEFORE" -gt 0 ]; then
              sed -i "s|bootstrapSecret: '2074ff0e9dea8fb3c8162a0301b6ea06bbb938187b89a0b6789ea583f25d34c8'|bootstrapSecret: '${RUNTIME_DASHBOARD_SECRET}'|g" web/analytics-dashboard/index.html
              BOOT_AFTER=$(grep -c "bootstrapSecret: '${RUNTIME_DASHBOARD_SECRET}'" web/analytics-dashboard/index.html || true)
              echo "bootstrapSecret occurrences before=$BOOT_BEFORE after=$BOOT_AFTER"
              if [ "$BOOT_AFTER" -eq 0 ]; then
                echo "FATAL: dashboard bootstrapSecret patch failed"; exit 1
              fi
            else
              echo "INFO: no legacy bootstrapSecret placeholder (server-validated admin_login) - skipping patch"
            fi
          else
            echo "WARN: web/analytics-dashboard/index.html missing - overlay will be a no-op"
          fi

      - name: Build amd64 image + pre-push smoke test
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --provenance=false \
            --sbom=false \
            -f Dockerfile.production \
            --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "${REPOSITORY_URI}:${IMAGE_VERSION}" \
            -t "${REPOSITORY_URI}:latest" \
            .
          docker images --digests "${REPOSITORY_URI}" | head -5
          echo "=== Pre-push smoke test (JS runtime health) ==="
          chmod +x scripts/smoke-test-js-runtime.sh
          ./scripts/smoke-test-js-runtime.sh image "${REPOSITORY_URI}:${IMAGE_VERSION}"

      - name: Build + push multi-arch (amd64+arm64)
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            -f Dockerfile.production \
            --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "${REPOSITORY_URI}:${IMAGE_VERSION}" \
            -t "${REPOSITORY_URI}:latest" \
            --push \
            .

      - name: Deploy (digest-pinned, env inject, auto-rollback)
        run: |
          set -euo pipefail
          chmod +x scripts/ecr-digest.sh scripts/smoke-test-js-runtime.sh
          # shellcheck disable=SC1091
          . scripts/ecr-digest.sh
          assert_aws_account "$AWS_ACCOUNT_ID" "nakama digest-pinned rollout"

          IMAGE_DIGEST=$(aws ecr describe-images \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_VERSION" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "IMAGE_DIGEST=$IMAGE_DIGEST"
          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "FATAL: describe-images returned no digest for tag $IMAGE_VERSION"
            exit 1
          fi
          NEW_IMAGE="${REPOSITORY_URI}@${IMAGE_DIGEST}"
          verify_tag_serves_arm64 "${REPOSITORY_URI}:${IMAGE_VERSION}"
          if ! ecr_has_digest "$IMAGE_DIGEST"; then
            echo "FATAL: $NEW_IMAGE is not pullable from ECR in account $AWS_ACCOUNT_ID"
            exit 1
          fi

          SPEC_IMAGE=$(kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          WORKING_IMAGE=$(working_image_from_ready_pod "$K8S_NAMESPACE" "$K8S_DEPLOYMENT")
          echo "SPEC_IMAGE=$SPEC_IMAGE"
          echo "WORKING_IMAGE=$WORKING_IMAGE"
          ROLLBACK_IMAGE="$WORKING_IMAGE"
          if [ -z "$ROLLBACK_IMAGE" ]; then
            ROLLBACK_IMAGE="$SPEC_IMAGE"
          fi
          if [ -n "$ROLLBACK_IMAGE" ] && ecr_has_digest "$ROLLBACK_IMAGE"; then
            ecr_protect_tag "$ROLLBACK_IMAGE" "prod-rollback" || true
          elif [ -n "$ROLLBACK_IMAGE" ]; then
            echo "WARN: rollback candidate $ROLLBACK_IMAGE is not in ECR (node-cached only)"
          fi
          ecr_protect_tag "$IMAGE_DIGEST" "prod-candidate" || true

          # Runtime keys from SSM (was CodeBuild env parameter-store block)
          getp() { aws ssm get-parameter --name "$1" --with-decryption --query Parameter.Value --output text 2>/dev/null || true; }
          # GATEWAY-CENTRALIZATION 2026-07-08: /nakama/OPENAI_API_KEY is no
          # longer injected. All module LLM paths (chatbox/ai_player/blog_embed)
          # ride the LiteLLM gateway via QWEN3_BASE_URL + the nakama virtual key
          # (nakama-litellm-key secret); the direct-OpenAI branch is a dormant
          # fallback that must not hold a raw vendor key (it was the org's
          # canonical key sitting in plaintext deployment env — audit P0).
          # The unset below actively removes the stale value from the live env.
          TMDB_API_KEY=$(getp /nakama/TMDB_API_KEY)
          LASTFM_API_KEY=$(getp /nakama/LASTFM_API_KEY)
          GNEWS_API_KEY=$(getp /nakama/GNEWS_API_KEY)
          CURRENTS_API_KEY=$(getp /nakama/CURRENTS_API_KEY)
          MEDIASTACK_API_KEY=$(getp /nakama/MEDIASTACK_API_KEY)
          NEWSAPI_API_KEY=$(getp /nakama/NEWSAPI_API_KEY)
          NASA_API_KEY=$(getp /nakama/NASA_API_KEY)
          XAI_API_KEY=""

          echo "=== Patching rollout strategy (progressDeadline=900s, maxSurge=4) ==="
          kubectl patch deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" \
            --type=merge \
            --patch='{"spec":{"progressDeadlineSeconds":900,"strategy":{"type":"RollingUpdate","rollingUpdate":{"maxSurge":4,"maxUnavailable":0}}}}'

          echo "=== Injecting runtime secrets into deployment env (before image update) ==="
          echo "=== Removing legacy raw OPENAI_API_KEY from deployment env (LiteLLM gateway holds vendor keys) ==="
          kubectl set env deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" OPENAI_API_KEY- || true
          INJECT_ARGS=""
          [ -n "$XAI_API_KEY" ]        && INJECT_ARGS="$INJECT_ARGS XAI_API_KEY=$XAI_API_KEY"
          [ -n "$LLM_PROVIDER" ]       && INJECT_ARGS="$INJECT_ARGS LLM_PROVIDER=$LLM_PROVIDER"
          [ -n "$TMDB_API_KEY" ]       && INJECT_ARGS="$INJECT_ARGS TMDB_API_KEY=$TMDB_API_KEY"
          [ -n "$LASTFM_API_KEY" ]     && INJECT_ARGS="$INJECT_ARGS LASTFM_API_KEY=$LASTFM_API_KEY"
          [ -n "$GNEWS_API_KEY" ]      && INJECT_ARGS="$INJECT_ARGS GNEWS_API_KEY=$GNEWS_API_KEY"
          [ -n "$CURRENTS_API_KEY" ]   && INJECT_ARGS="$INJECT_ARGS CURRENTS_API_KEY=$CURRENTS_API_KEY"
          [ -n "$MEDIASTACK_API_KEY" ] && INJECT_ARGS="$INJECT_ARGS MEDIASTACK_API_KEY=$MEDIASTACK_API_KEY"
          [ -n "$NEWSAPI_API_KEY" ]    && INJECT_ARGS="$INJECT_ARGS NEWSAPI_API_KEY=$NEWSAPI_API_KEY"
          [ -n "$NASA_API_KEY" ]       && INJECT_ARGS="$INJECT_ARGS NASA_API_KEY=$NASA_API_KEY"
          INJECT_ARGS="$INJECT_ARGS DASHBOARD_SECRET=$RUNTIME_DASHBOARD_SECRET ROLLUP_ENABLED=true DASHBOARD_PREFER_ROLLUPS=true"
          kubectl set env deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" $INJECT_ARGS

          CURRENT_REPLICAS=$(kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')
          pause_hpa "$K8S_NAMESPACE" intelliverse-nakama "$CURRENT_REPLICAS"
          trap 'restore_hpa "$K8S_NAMESPACE" intelliverse-nakama' EXIT
          delete_unpullable_pods "$K8S_NAMESPACE" "$K8S_DEPLOYMENT"

          echo "=== Rolling deployment to ${IMAGE_VERSION} (digest pinned) ==="
          kubectl set image deployment/"$K8S_DEPLOYMENT" \
            "$K8S_CONTAINER"="$NEW_IMAGE" -n "$K8S_NAMESPACE"

          echo "=== Post-rollout JS runtime smoke test ==="
          set +e
          ./scripts/smoke-test-js-runtime.sh cluster "$K8S_NAMESPACE" "$K8S_DEPLOYMENT"
          SMOKE_RC=$?
          set -e
          if [ "$SMOKE_RC" -ne 0 ]; then
            echo "Post-rollout smoke test FAILED"
            SAFE_ROLLBACK=""
            if [ -n "$ROLLBACK_IMAGE" ] && [ "$ROLLBACK_IMAGE" != "$NEW_IMAGE" ]; then
              if ecr_has_digest "$ROLLBACK_IMAGE"; then
                SAFE_ROLLBACK="$ROLLBACK_IMAGE"
              else
                echo "WARN: refusing to roll back to $ROLLBACK_IMAGE — digest is not in ECR"
              fi
            fi
            if [ -n "$SAFE_ROLLBACK" ]; then
              echo "auto-rolling back to $SAFE_ROLLBACK"
              kubectl set image deployment/"$K8S_DEPLOYMENT" \
                "$K8S_CONTAINER=$SAFE_ROLLBACK" -n "$K8S_NAMESPACE"
              set +e
              kubectl rollout status deployment/"$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=12m
              set -e
            else
              echo "No pullable rollback image. Leaving spec on $NEW_IMAGE rather than pinning a ghost digest."
            fi
            if [ "$SMOKE_RC" -eq 3 ]; then
              echo "Rolled back after CNI pod-IP exhaustion - non-fatal."
            else
              echo "Rolled back. Failing the run."
              exit 1
            fi
          fi
          ecr_protect_tag "$IMAGE_DIGEST" "prod" || true
          LIVE_IMAGE=$(kubectl get deployment "$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}')
          echo "LIVE_IMAGE=$LIVE_IMAGE"
          kubectl get pods -n "$K8S_NAMESPACE" -l app="$K8S_DEPLOYMENT" -o wide

      - name: Deploy multiplayer tier (same digest, auto-rollback)
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . scripts/ecr-digest.sh
          if ! kubectl get deployment "$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" >/dev/null 2>&1; then
            echo "INFO: $K8S_MP_DEPLOYMENT not found in $K8S_NAMESPACE - skipping."
            exit 0
          fi
          IMAGE_DIGEST=$(aws ecr describe-images \
            --registry-id "$AWS_ACCOUNT_ID" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_VERSION" \
            --query 'imageDetails[0].imageDigest' --output text)
          NEW_IMAGE="${REPOSITORY_URI}@${IMAGE_DIGEST}"
          if ! ecr_has_digest "$IMAGE_DIGEST"; then
            echo "FATAL: $NEW_IMAGE is not pullable — refusing multiplayer roll"
            exit 1
          fi
          MP_SPEC=$(kubectl get deployment "$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          MP_WORKING=$(working_image_from_ready_pod "$K8S_NAMESPACE" "$K8S_MP_DEPLOYMENT")
          MP_ROLLBACK="${MP_WORKING:-$MP_SPEC}"
          echo "MP_SPEC=$MP_SPEC"
          echo "MP_WORKING=$MP_WORKING"
          if [ "$MP_SPEC" = "$NEW_IMAGE" ]; then
            echo "Multiplayer tier already on ${IMAGE_DIGEST} - nothing to do."
            exit 0
          fi
          MP_REPLICAS=$(kubectl get deployment "$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')
          pause_hpa "$K8S_NAMESPACE" intelliverse-nakama-multiplayer "$MP_REPLICAS"
          trap 'restore_hpa "$K8S_NAMESPACE" intelliverse-nakama-multiplayer' EXIT
          delete_unpullable_pods "$K8S_NAMESPACE" "$K8S_MP_DEPLOYMENT"
          echo "=== Rolling $K8S_MP_DEPLOYMENT to ${IMAGE_VERSION} (${IMAGE_DIGEST}) ==="
          kubectl set image deployment/"$K8S_MP_DEPLOYMENT" \
            "$K8S_MP_CONTAINER"="$NEW_IMAGE" -n "$K8S_NAMESPACE"
          kubectl annotate deployment/"$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" --overwrite \
            kubernetes.io/change-cause="deploy-eks gha${GITHUB_RUN_NUMBER}: ${IMAGE_VERSION} (digest pinned)"
          set +e
          kubectl rollout status deployment/"$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=15m
          MP_RC=$?
          set -e
          if [ "$MP_RC" -ne 0 ]; then
            echo "Multiplayer rollout FAILED"
            if [ -n "$MP_ROLLBACK" ] && [ "$MP_ROLLBACK" != "$NEW_IMAGE" ] && ecr_has_digest "$MP_ROLLBACK"; then
              echo "rolling back to $MP_ROLLBACK"
              kubectl set image deployment/"$K8S_MP_DEPLOYMENT" \
                "$K8S_MP_CONTAINER=$MP_ROLLBACK" -n "$K8S_NAMESPACE"
              kubectl rollout status deployment/"$K8S_MP_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=15m || true
            else
              echo "WARN: refusing to roll multiplayer back onto an unpullable digest ($MP_ROLLBACK)"
            fi
            echo "Rolled back multiplayer tier. Failing the run."
            exit 1
          fi
          kubectl get pods -n "$K8S_NAMESPACE" -l app="$K8S_MP_DEPLOYMENT" -o wide

      - name: Analytics bootstrap backfill (non-fatal)
        continue-on-error: true
        run: |
          NAKAMA_EXTERNAL_URL="https://nakama-rest.intelli-verse-x.ai"
          BACKFILL_FROM=$(date -u -d "30 days ago" +%Y-%m-%d)
          BACKFILL_TO=$(date -u -d "yesterday" +%Y-%m-%d)
          echo "Backfilling $BACKFILL_FROM to $BACKFILL_TO"
          BF_STATUS=$(curl -s -o /tmp/backfill.json -w "%{http_code}" \
            -X POST "${NAKAMA_EXTERNAL_URL}/v2/rpc/analytics_rollup_backfill?http_key=${RUNTIME_HTTP_KEY}&unwrap=true" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"${BACKFILL_FROM}\",\"to\":\"${BACKFILL_TO}\",\"dashboard_secret\":\"${RUNTIME_DASHBOARD_SECRET}\"}" \
            --max-time 1800 --retry 3 --retry-delay 30 --retry-connrefused \
            || echo "000")
          echo "Backfill HTTP status=${BF_STATUS}"
          head -c 500 /tmp/backfill.json 2>/dev/null; echo ""

      - name: Admin console deploy (only when web/ changed, non-fatal)
        continue-on-error: true
        run: |
          ADMIN_REPO="${ECR_REGISTRY}/nakama-admin-dashboard"
          ADMIN_TAG="${IMAGE_VERSION}"
          WEB_CHANGED="unknown"
          if git rev-parse "${GITHUB_SHA}~1" >/dev/null 2>&1; then
            if git diff --name-only "${GITHUB_SHA}~1" "${GITHUB_SHA}" | grep -q '^web/'; then
              WEB_CHANGED="yes"
            else
              WEB_CHANGED="no"
            fi
          fi
          echo "web/ changed: ${WEB_CHANGED}"
          if [ "${WEB_CHANGED}" = "no" ]; then
            echo "No web/ changes - skipping console rebuild."
            exit 0
          fi
          if docker buildx build --platform linux/amd64,linux/arm64 --provenance=false \
               -f web/packages/admin/Dockerfile \
               -t "${ADMIN_REPO}:${ADMIN_TAG}" -t "${ADMIN_REPO}:latest" --push web; then
            ADMIN_DIGEST=$(aws ecr describe-images --repository-name nakama-admin-dashboard \
              --image-ids imageTag="${ADMIN_TAG}" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null)
            if [ -n "${ADMIN_DIGEST}" ] && [ "${ADMIN_DIGEST}" != "None" ]; then
              kubectl set image deployment/nakama-admin-dashboard admin-dashboard="${ADMIN_REPO}@${ADMIN_DIGEST}" -n "$K8S_NAMESPACE"
              kubectl rollout status deployment/nakama-admin-dashboard -n "$K8S_NAMESPACE" --timeout=180s
              echo "console rolled to ${ADMIN_TAG}"
            else
              echo "WARN: could not resolve console digest - skipping rollout."
            fi
          else
            echo "WARN: console build failed - leaving current console image in place."
          fi
