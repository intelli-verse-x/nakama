name: no-credential-literals

# Advisory guard. Not registered as a required check here - required-check
# configuration is owned elsewhere.
on:
  pull_request:
    paths:
      - 'data/modules/**'
      - 'scripts/check-no-credential-literals.sh'
  push:
    branches: [master]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential literals in data/modules
        run: ./scripts/check-no-credential-literals.sh data/modules
